<!-- ADD PROJECT FEATURE — Copilot context anchor
     This file contains the Projects screen layout, including the Add Project button,
     modal markup, dynamic field containers, and validation dialog structure. -->
<section class="projects-screen hm-card">
  <div data-main-nav></div>

  <header class="projects-header">
    <div>
      <h1>Projects</h1>
      <p class="hm-muted">Unified projects from home, vehicle, and repeating lists.</p>
    </div>
    <div class="projects-header-actions">
      <input id="projectsSearchInput" type="search" class="projects-search-input" placeholder="Search projects" aria-label="Search projects" />
      <button id="projectsAddBtn" type="button" class="primary">Add Project</button>
      <div class="projects-summary" id="projectsSummary">Loading projects...</div>
    </div>
  </header>

  <div id="projectsSyncStatus" class="projects-sync-status hidden" aria-live="polite"></div>
  <div id="projectsDuplicateBanner" class="projects-duplicate-banner hidden" aria-live="polite"></div>

  <section class="projects-controls" aria-label="Project filters and sorting">
    <label class="projects-filter-group">
      Source
      <details class="projects-filter-dropdown" id="projectsFilterSourceDropdown">
        <summary><span id="projectsFilterSourceSummary">All sources</span></summary>
        <div id="projectsFilterSource" class="projects-filter-options" role="group" aria-label="Source filter options"></div>
      </details>
    </label>

    <label class="projects-filter-group">
      Category
      <details class="projects-filter-dropdown" id="projectsFilterCategoryDropdown">
        <summary><span id="projectsFilterCategorySummary">All categories</span></summary>
        <div id="projectsFilterCategory" class="projects-filter-options" role="group" aria-label="Category filter options"></div>
      </details>
    </label>

    <label class="projects-filter-group">
      State
      <details class="projects-filter-dropdown" id="projectsFilterStateDropdown">
        <summary><span id="projectsFilterStateSummary">All states except Completed</span></summary>
        <div id="projectsFilterState" class="projects-filter-options" role="group" aria-label="State filter options"></div>
      </details>
    </label>

    <label>
      Sort By
      <select id="projectsSortBy">
        <option value="order">Order</option>
        <option value="priority">Priority</option>
        <option value="category">Category</option>
      </select>
    </label>
  </section>

  <div id="projectsList" class="projects-list" aria-live="polite"></div>

  <div id="projectEditModal" class="project-modal hidden" role="dialog" aria-modal="true" aria-labelledby="projectEditTitle">
    <div class="project-modal-panel">
      <header class="project-modal-header">
        <h2 id="projectEditTitle">Edit Project Details</h2>
        <button id="projectEditClose" type="button" class="project-modal-close" aria-label="Close">x</button>
      </header>

      <form id="projectEditForm" class="project-edit-form">
        <div id="projectEditFields" class="project-edit-grid"></div>
        <p id="projectEditMessage" class="project-edit-message hm-muted" aria-live="polite"></p>

        <div class="project-edit-actions">
          <button id="projectEditCancel" type="button">Cancel</button>
          <button id="projectEditSave" type="submit" class="primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div id="projectDeleteModal" class="project-modal hidden" role="dialog" aria-modal="true" aria-labelledby="projectDeleteTitle">
    <div class="project-modal-panel project-delete-modal-panel">
      <header class="project-modal-header">
        <h2 id="projectDeleteTitle">Delete Project</h2>
        <button id="projectDeleteClose" type="button" class="project-modal-close" aria-label="Close">x</button>
      </header>

      <div class="project-delete-content">
        <p id="projectDeleteMessage">Are you sure you want to delete this project? This cannot be undone.</p>
        <p id="projectDeleteStatus" class="project-edit-message hm-muted" aria-live="polite"></p>

        <div class="project-edit-actions">
          <button id="projectDeleteCancel" type="button" class="project-delete-cancel">Cancel</button>
          <button id="projectDeleteConfirm" type="button" class="project-delete-confirm">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <div id="projectAddModal" class="project-modal hidden" role="dialog" aria-modal="true" aria-labelledby="projectAddTitle">
    <div class="project-modal-panel">
      <header class="project-modal-header">
        <h2 id="projectAddTitle">Add Project</h2>
        <button id="projectAddClose" type="button" class="project-modal-close" aria-label="Close">x</button>
      </header>

      <form id="projectAddForm" class="project-edit-form">
        <div class="project-edit-grid project-add-initial-grid">
          <div class="project-edit-field">
            <label for="projectAddProperty">Property</label>
            <select id="projectAddProperty">
              <option value="">Select property</option>
            </select>
          </div>

          <div class="project-edit-field">
            <label for="projectAddVehicle">Vehicle / Engine</label>
            <select id="projectAddVehicle">
              <option value="">Select vehicle/engine</option>
            </select>
          </div>
        </div>

        <div id="projectAddDynamicFields" class="project-edit-grid"></div>
        <p id="projectAddMessage" class="project-edit-message hm-muted" aria-live="polite"></p>

        <div class="project-edit-actions">
          <button id="projectAddCancel" type="button">Cancel</button>
          <button id="projectAddSubmit" type="submit" class="primary">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <div id="projectAddResultModal" class="project-modal hidden" role="dialog" aria-modal="true" aria-labelledby="projectAddResultTitle">
    <div class="project-modal-panel project-delete-modal-panel">
      <header class="project-modal-header">
        <h2 id="projectAddResultTitle">Validation</h2>
        <button id="projectAddResultCloseTop" type="button" class="project-modal-close" aria-label="Close">x</button>
      </header>

      <div class="project-delete-content">
        <p id="projectAddResultMessage">Project created successfully.</p>

        <div class="project-edit-actions">
          <button id="projectAddResultClose" type="button" class="primary">Close</button>
        </div>
      </div>
    </div>
  </div>

</section>
