  <header class="tasks-header">
    <div>
      <h1>Task Manager</h1>
      <p class="hm-muted">Curate project tasks and repeating household tasks for weekly planning.</p>
    </div>
    <div id="tasksStatus" class="tasks-status">Loading tasks...</div>
  </header>

  <section class="task-section" aria-label="Project-based tasks section">

    <div id="projectTaskList" class="task-card-list" aria-live="polite"></div>

  <section class="task-section" aria-label="Repeatable tasks section">
    <h2>Repeatable Tasks</h2>
    <div id="repeatableTaskList" class="task-card-list" aria-live="polite"></div>
  </section>

</section>
