<section class="planner-screen hm-card">
  <div data-main-nav></div>

  <header class="planner-header">
    <div>
      <h1>Weekly Planner</h1>
      <p class="hm-muted">Assign curated tasks to day and time slots for the current week.</p>
    </div>
    <div id="plannerStatus" class="planner-status">Loading planner...</div>
  </header>

  <section class="planner-pool" aria-label="Task assignment pool">
    <h2>Curated Tasks</h2>
    <div id="plannerTaskPool" class="planner-task-pool" aria-live="polite"></div>
  </section>

  <section class="planner-week" aria-label="Weekly planner grid">
    <div id="plannerWeekGrid" class="planner-week-grid" aria-live="polite"></div>
  </section>

</section>
