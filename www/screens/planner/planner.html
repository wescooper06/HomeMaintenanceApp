<section class="planner-screen hm-card">
  <div data-main-nav></div>

  <header class="planner-header">
    <div>
      <h1>Weekly Planner</h1>
    </div>
    <div id="plannerStatus" class="planner-status">Loading planner...</div>
  </header>

  <section class="planner-top-panels" aria-label="Task assignment panels">
    <div id="planner-top-columns">
      <section id="curated-left" class="planner-pool curated-drop-zone" aria-label="Curated tasks left column">
        <h2>Curated Tasks</h2>
        <div id="curated-warning"></div>
        <div id="plannerTaskPoolLeft" class="planner-task-pool" data-curated-column="left" aria-live="polite"></div>
      </section>

      <section id="curated-middle" class="planner-pool curated-drop-zone" aria-label="Curated tasks middle column">
        <h2>Curated Tasks</h2>
        <div id="plannerTaskPoolMiddle" class="planner-task-pool" data-curated-column="middle" aria-live="polite"></div>
      </section>

      <section id="adhoc-right" class="planner-adhoc-column" aria-label="Add ad-hoc task panel">
        <h2>Add Ad-Hoc Task</h2>
        <div class="planner-adhoc-panel">
          <div class="adhoc-form">
          <label for="adhocTaskTitle">Title</label>
            <input id="adhocTaskTitle" class="planner-control-field" type="text" placeholder="Enter task title" />

          <label for="adhocTaskDay">Day</label>
            <select id="adhocTaskDay" class="planner-control-field">
            <option value="mon">Monday</option>
            <option value="tue">Tuesday</option>
            <option value="wed">Wednesday</option>
            <option value="thu">Thursday</option>
            <option value="fri">Friday</option>
            <option value="sat">Saturday</option>
            <option value="sun">Sunday</option>
          </select>

          <label for="adhocTaskSlot">Time</label>
            <select id="adhocTaskSlot" class="planner-control-field">
            <option value="morning">Morning</option>
            <option value="afternoon">Afternoon</option>
            <option value="evening">Evening</option>
          </select>

            <div class="adhoc-actions">
              <button id="adhocTaskAddBtn" type="button" class="primary">Add</button>
            </div>
          </div>
        </div>
      </section>

      <section id="repeatable-right" class="planner-repeatable-column" aria-label="Repeatable tasks panel">
        <h2>Repeatable Tasks</h2>
        <div id="repeatable-tasks-panel" class="repeatable-task-panel" aria-live="polite"></div>
      </section>

      <section id="mini-calendar-column" class="planner-calendar-column" aria-label="Mini calendar panel">
        <h2>Task Calendar</h2>
        <div id="mini-calendar"></div>
      </section>
    </div>
  </section>

  <section class="planner-week" aria-label="Weekly planner grid">
    <div class="weekly-week-nav" aria-label="Weekly navigation">
        <button type="button" id="week-prev" aria-label="Previous week">◀</button>
      <h2 id="weekly-week-label">Weekly Schedule</h2>
        <button type="button" id="week-today" class="weekly-week-today" aria-label="Go to current week">Today</button>
        <button type="button" id="week-next" aria-label="Next week">▶</button>
    </div>
    <div id="weekly-scroll-container">
      <div class="weekly-week-block">
        <div id="plannerWeekGrid" class="planner-week-grid weekly-week-grid" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <div id="weather-modal" class="weather-modal-host" hidden></div>

</section>
